<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
 <meta name="theme-color" content="#0b1929">
 <meta name="apple-mobile-web-app-capable" content="yes">
 <title>Dice Racers</title>
 <style>
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1929;font-family:system-ui,sans-serif;color:#fff;overscroll-behavior:none}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #game{position:relative;width:100%;height:100%;height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none;outline:none;-webkit-tap-highlight-color:transparent}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:#0b1929;padding:24px;text-align:center}
  h1{font-size:clamp(26px,7vw,44px);font-style:italic;margin:0;color:#42c6f3}h1 span{color:#ffcc4d}
  #rail{width:min(260px,75vw);height:8px;border-radius:8px;background:#213a50;overflow:hidden}#fill{height:100%;width:0;background:#27c4a6;transition:width .15s}
  #status{font-size:14px;color:#bed8e8;max-width:340px;line-height:1.5;margin:0}button{background:#27c4a6;color:#092332;border:0;border-radius:12px;padding:12px 24px;font:700 16px system-ui;cursor:pointer}
 </style>
</head>
<body><main id="game"><canvas id="unity-canvas" tabindex="0" aria-label="Dice Racers game. Tap controls to choose dice actions."></canvas>
<section id="loading" aria-live="polite"><h1><span>DICE</span> RACERS</h1><div id="rail"><div id="fill"></div></div><p id="status">Loading your racers…<br>Best played in portrait.</p></section></main>
<script>
 const canvas=document.getElementById('unity-canvas'),loading=document.getElementById('loading'),status=document.getElementById('status');
 canvas.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
 canvas.addEventListener('contextmenu',e=>e.preventDefault());
 const config={dataUrl:'Build/6eff0425753421fdcd6a45a3af2e1e1f.data.unityweb',frameworkUrl:'Build/ad4be89fa803a520037e363579ef2aba.framework.js.unityweb',codeUrl:'Build/e5e1af2232097c2f92c4ec365e0b1dbc.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:'Dice Racers',productName:'Dice Racers',productVersion:'1.0',matchWebGLToCanvasSize:true,devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5),showBanner:(text,type)=>{if(type==='error'){loading.style.display='flex';status.textContent=text;}}};
 const script=document.createElement('script');script.src='Build/bcab10f33090711bcab0df3004662e67.loader.js';
 function failure(message){loading.style.display='flex';status.textContent='The game could not start. '+message;const retry=document.createElement('button');retry.textContent='Try again';retry.onclick=()=>location.reload();loading.appendChild(retry);}
 script.onerror=()=>failure('Check your connection and try again.');
 script.onload=()=>createUnityInstance(canvas,config,p=>document.getElementById('fill').style.width=(p*100)+'%').then(instance=>{window.diceRacers=instance;loading.style.display='none';canvas.focus();}).catch(e=>failure(String(e)));
 document.body.appendChild(script);
</script></body></html>
